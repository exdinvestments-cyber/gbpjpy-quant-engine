[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbpjpy-quant-engine"
version = "0.1.1"
description = "GBPJPY H4 Market Intelligence Engine (Phase 1A) - descriptive market-context analysis only; no execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
gbpjpy-h4 = "gbpjpy_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
